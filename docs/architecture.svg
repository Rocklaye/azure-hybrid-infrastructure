<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="440" rx="12" fill="#f6f8fa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#24292f">Infrastructure hybride Azure / on-premise</text>

  <!-- On-premise -->
  <rect x="30" y="70" width="300" height="320" rx="10" fill="#ffffff" stroke="#8b949e" stroke-width="1.5"/>
  <text x="180" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#57606a">On-premise · datacenter</text>
  <rect x="60" y="120" width="240" height="60" rx="8" fill="#eef1f5" stroke="#b1bac4"/>
  <text x="180" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Active Directory DS</text>
  <text x="180" y="165" text-anchor="middle" font-size="11" fill="#57606a">Azure AD Connect (sync)</text>
  <rect x="60" y="200" width="240" height="54" rx="8" fill="#eef1f5" stroke="#b1bac4"/>
  <text x="180" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Serveurs · Hyper-V</text>
  <rect x="60" y="280" width="240" height="54" rx="8" fill="#eef1f5" stroke="#b1bac4"/>
  <text x="180" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Pare-feu / routeur</text>

  <!-- VPN tunnel -->
  <line x1="330" y1="305" x2="590" y2="305" stroke="#0078D4" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="460" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#0078D4">VPN site-to-site (IPSec)</text>
  <!-- identity sync arrow -->
  <line x1="330" y1="150" x2="590" y2="150" stroke="#8250df" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="460" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#8250df">Synchronisation des identités</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- Azure -->
  <rect x="590" y="70" width="300" height="320" rx="10" fill="#ffffff" stroke="#0078D4" stroke-width="2"/>
  <text x="740" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#0078D4">Microsoft Azure</text>

  <rect x="615" y="112" width="250" height="150" rx="8" fill="#eaf3fb" stroke="#4aa0e6"/>
  <text x="740" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0b4f86">VNet 10.10.0.0/16</text>
  <rect x="630" y="142" width="220" height="30" rx="6" fill="#ffffff" stroke="#9cc6ec"/>
  <text x="740" y="162" text-anchor="middle" font-size="11" fill="#24292f">GatewaySubnet → VPN Gateway</text>
  <rect x="630" y="178" width="220" height="30" rx="6" fill="#ffffff" stroke="#9cc6ec"/>
  <text x="740" y="198" text-anchor="middle" font-size="11" fill="#24292f">snet-app → VM Linux / Windows</text>
  <rect x="630" y="214" width="220" height="30" rx="6" fill="#ffffff" stroke="#9cc6ec"/>
  <text x="740" y="234" text-anchor="middle" font-size="11" fill="#24292f">snet-mgmt → administration</text>

  <rect x="615" y="278" width="250" height="40" rx="8" fill="#eae6fb" stroke="#8250df"/>
  <text x="740" y="303" text-anchor="middle" font-size="12" font-weight="600" fill="#4b2c91">Entra ID · identités hybrides (RBAC)</text>

  <rect x="615" y="330" width="250" height="40" rx="8" fill="#e7f6ee" stroke="#1a7f37"/>
  <text x="740" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#116329">Azure Monitor · Log Analytics</text>
</svg>
